<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020008">
<title>Для тебя 💜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020008}
body{touch-action:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7efff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.text{position:absolute;text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1.4s,transform 1.4s;text-shadow:0 0 22px #a85cff,0 0 45px #6420aa}
.show{opacity:1!important;transform:translateY(0)!important}
#intro{top:12%;font-size:clamp(14px,4vw,19px);letter-spacing:3px;color:#cdb8e8}
#hint{bottom:9%;font-size:clamp(13px,3.7vw,17px);letter-spacing:1.5px;color:#d8c6eb}
#final{width:88%;font-size:clamp(21px,6vw,32px);line-height:1.4;bottom:13%}
#final small{display:block;margin-top:12px;font-size:.52em;letter-spacing:1px;color:#cdb9df}
#fade{position:fixed;inset:0;background:#020008;opacity:1;pointer-events:none;transition:opacity 2s}
</style>
<style>
.actionBtn{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);padding:13px 23px;border-radius:999px;border:1px solid rgba(218,163,255,.58);background:rgba(27,7,47,.65);color:#f4eaff;font:inherit;font-size:14px;letter-spacing:1px;box-shadow:0 0 26px rgba(150,65,255,.28);backdrop-filter:blur(8px);pointer-events:auto;opacity:0;transition:opacity 1.1s,transform .2s}
.actionBtn:active{transform:translateX(-50%) scale(.95)}
.secondary{bottom:16.5vh;display:none}
#romanticText{opacity:0;transition:opacity 1.5s}
#final.show #romanticText{opacity:1}
.starHint{position:fixed;top:10%;left:50%;transform:translateX(-50%);color:#d7c4e9;font-size:14px;letter-spacing:1px;opacity:0;transition:opacity 1s;pointer-events:none}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button id="wordsBtn" class="actionBtn">открыть мои слова 💜</button>
<button id="starBtn" class="actionBtn secondary">зажги звезду ✨</button>
<div id="starHint" class="starHint">загадай желание</div>
  <div id="intro" class="text">для тебя, моё солнышко</div>
  <div id="hint" class="text">прикоснись к сердцу</div>
  <div id="final" class="text"><div id="romanticText">Мне достаточно просто знать, что ты рядом.<br>И я очень счастлив, что однажды встретил именно тебя. 💜<small>Спасибо, что ты у меня есть, моё солнышко.</small></div></div>
</div>
<div id="fade"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,D=1,cx,cy,t=0,stage=0,stageTime=0,started=false,finalShown=false,heartProgress=0;
let stars=[],heart=[],gal=[],bursts=[],touch={down:false,x:0,y:0},hold=0;

const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);
 cx=W/2;cy=H*.48; build();
}
function build(){
 stars=[];heart=[];gal=[];
 for(let i=0;i<520;i++) stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.25,1.25),a:rnd(.18,.8),p:rnd(0,6.28),tw:rnd(.001,.003)});
 for(let i=0;i<1100;i++){
   const a=Math.random()*Math.PI*2, f=Math.sqrt(Math.random());
   const sx=16*Math.sin(a)**3, sy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
   const sc=Math.min(W,H)/42;
   heart.push({sx:rnd(0,W),sy:rnd(0,H),tx:cx+sx*sc*f,ty:cy+sy*sc*f,
     r:rnd(.35,1.65),a:rnd(.35,1),p:rnd(0,6.28),drift:rnd(.3,1)});
 }
 for(let i=0;i<340;i++) gal.push({a:rnd(0,6.28),r:rnd(.78,1.42),s:rnd(.00045,.0016),z:rnd(.4,1.5),p:rnd(0,6.28)});
}
function setStage(n){
 stage=n;stageTime=t;
 if(n===1) document.getElementById('intro').classList.add('show');
 if(n===3) setTimeout(()=>document.getElementById('hint').classList.add('show'),500);
 if(n===4){document.getElementById('hint').classList.remove('show');setTimeout(()=>document.getElementById('wordsBtn').style.opacity=1,700);setTimeout(()=>document.getElementById('starBtn').style.display='block',1000)}
}
function bg(){
 let g=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.78);
 g.addColorStop(0,'#17002b');g.addColorStop(.34,'#090012');g.addColorStop(1,'#010006');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of stars){
   const a=s.a*(.55+.45*Math.sin(t*s.tw+s.p));
   x.fillStyle=`rgba(191,116,255,${a})`;
   x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();
 }
}
function heartDraw(){
 const gather=Math.min(1,Math.max(0,heartProgress));
 const ease=1-Math.pow(1-gather,3);
 const pulse=1+Math.sin(t*.00165)*.038;
 x.save(); x.globalCompositeOperation='lighter';

 // Soft living glow around the whole heart.
 const glowR=Math.min(W,H)*(.17+.018*Math.sin(t*.0048));
 const glow=x.createRadialGradient(cx,cy,0,cx,cy,glowR);
 glow.addColorStop(0,'rgba(229,151,255,.22)');
 glow.addColorStop(.38,'rgba(177,72,255,.11)');
 glow.addColorStop(1,'rgba(90,20,190,0)');
 x.fillStyle=glow; x.beginPath(); x.arc(cx,cy,glowR,0,6.28); x.fill();

 for(const p of heart){
   // Particles continuously orbit/flow inside the heart after gathering.
   const flow=Math.sin(t*.0015+p.p)*2.2;
   const swirl=(t*.00042*p.drift);
   const ox=Math.cos(swirl+p.p)*flow;
   const oy=Math.sin(swirl+p.p)*flow;

   let px=p.sx+(p.tx-p.sx)*ease + ox;
   let py=p.sy+(p.ty-p.sy)*ease + oy;

   // Tiny breathing movement makes the shape feel alive rather than frozen.
   const bx=Math.sin(t*.0021+p.p*1.7)*1.7*p.drift;
   const by=Math.cos(t*.0018+p.p*1.3)*1.7*p.drift;
   px=cx+(px-cx)*pulse+bx;
   py=cy+(py-cy)*pulse+by;

   const flick=.68+.32*Math.sin(t*.003+p.p);
   const rr=p.r*(1.0+.18*Math.sin(t*.0018+p.p));
   x.fillStyle=`rgba(225,145,255,${p.a*flick*(.72+.28*ease)})`;
   x.beginPath();x.arc(px,py,rr,0,6.28);x.fill();

   // A few brighter "living" particles.
   if(p.r>1.35){
     x.fillStyle=`rgba(248,211,255,${.28*flick})`;
     x.beginPath();x.arc(px,py,rr*2.1,0,6.28);x.fill();
   }
 }
 x.restore();
}
function galaxy(){
 if(stage<3)return;
 const prog=Math.min(1,(t-stageTime)/1800),R=Math.min(W,H)*.34;
 x.save();x.translate(cx,cy);x.globalCompositeOperation='lighter';
 for(let q=0;q<3;q++){
   x.beginPath();x.ellipse(0,0,R*(1+q*.16)*prog,R*(.19+q*.035)*prog,q*.32,0,6.28);
   x.strokeStyle=`rgba(190,105,255,${(.17-q*.025)*prog})`;x.lineWidth=1.2;x.stroke();
 }
 for(const p of gal){
   p.a+=p.s*(stage===4?2.3:1);
   const rr=R*p.r*prog;
   const px=Math.cos(p.a)*rr,py=Math.sin(p.a)*rr*(.19+p.r*.035);
   const tw=.45+.55*Math.sin(t*.003+p.p);
   x.fillStyle=`rgba(213,142,255,${tw})`;x.beginPath();x.arc(px,py,p.z,0,6.28);x.fill();
 }
 x.restore();
}
function core(){
 if(stage<3)return;
 const p=1+Math.sin(t*.004)*.07;
 const r=Math.min(W,H)*.085*p;
 let g=x.createRadialGradient(cx,cy,0,cx,cy,r*3);
 g.addColorStop(0,'rgba(235,175,255,.45)');g.addColorStop(1,'rgba(120,40,255,0)');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*3,0,6.28);x.fill();
}
function burst(px,py,power=1){
 for(let i=0;i<80;i++){
   const a=rnd(0,6.28),v=rnd(1.5,5.5)*power;
   bursts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:rnd(.5,1.8)});
 }
}
function drawBursts(){
 x.save();x.globalCompositeOperation='lighter';
 for(let i=bursts.length-1;i>=0;i--){
   let b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;b.life-=.018;
   x.fillStyle=`rgba(216,143,255,${Math.max(0,b.life)})`;
   x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill();
   if(b.life<=0)bursts.splice(i,1);
 }
 x.restore();
}
function loop(now){
 t=now;
 if(!started && t>400){
   started=true;
   document.getElementById('fade').style.opacity=0;
   setStage(1);
 }
 // One uninterrupted gathering animation: no reset between stages.
 if(started && heartProgress<1){
   heartProgress=Math.min(1, Math.max(0,(t-stageTime)/5200));
 }
 if(stage===1 && heartProgress>.12) setStage(2);
 if(stage===2 && heartProgress>=1) setStage(3);
 bg();heartDraw();galaxy();core();drawBursts();
 if(touch.down && stage>=3){
   const d=Math.hypot(touch.x-cx,touch.y-cy);
   if(d<Math.min(W,H)*.28){
     hold=Math.min(1,hold+.018);
     const rr=25+hold*75+Math.sin(t*.01)*4;
     x.save();x.globalCompositeOperation='lighter';
     x.strokeStyle=`rgba(224,153,255,${.25+.3*hold})`;x.lineWidth=2;
     x.beginPath();x.arc(touch.x,touch.y,rr,0,6.28);x.stroke();
     x.restore();
     if(hold>.95 && stage===3){burst(cx,cy,1.7);setStage(4)}
   }
 }else hold=Math.max(0,hold-.012);
 requestAnimationFrame(loop);
}
function pointerDown(e){
 touch.down=true;touch.x=e.clientX;touch.y=e.clientY;
 if(stage>=3)burst(touch.x,touch.y,.7);
}
function pointerMove(e){if(touch.down){touch.x=e.clientX;touch.y=e.clientY;if(stage>=3 && Math.random()<.45)burst(touch.x,touch.y,.16)}}
function pointerUp(){touch.down=false}
addEventListener('resize',resize);
addEventListener('pointerdown',pointerDown);
addEventListener('pointermove',pointerMove);
addEventListener('pointerup',pointerUp);
addEventListener('pointercancel',pointerUp);
resize();requestAnimationFrame(loop);
</script>
<!--
АЛЬТЕРНАТИВНЫЕ ФРАЗЫ:
1) «Мне достаточно, что в моей жизни есть ты.»
2) «Если у счастья есть место, то для меня оно рядом с тобой.»
3) «Я просто хочу, чтобы ты всегда знала: ты очень дорога мне. 💜»
-->
<script>
const wordsBtn=document.getElementById('wordsBtn'),starBtn=document.getElementById('starBtn'),starHint=document.getElementById('starHint');
wordsBtn.addEventListener('click',()=>{wordsBtn.style.opacity=0;setTimeout(()=>wordsBtn.style.display='none',900);document.getElementById('final').classList.add('show');burst(cx,cy,1.8);});
starBtn.addEventListener('click',()=>{starBtn.style.opacity=0;starHint.style.opacity=1;setTimeout(()=>starBtn.style.display='none',900);const sx=rnd(W*.2,W*.8),sy=H*.86;for(let i=0;i<100;i++){const a=rnd(0,6.28),v=rnd(1,4.5);bursts.push({x:sx,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:rnd(.5,1.7)});}setTimeout(()=>burst(cx,cy,2.2),900);});
</script></body>
</html>
